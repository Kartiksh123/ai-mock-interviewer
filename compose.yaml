services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intervue
      POSTGRES_USER: intervue
      POSTGRES_PASSWORD: local-intervue-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervue -d intervue"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://intervue:local-intervue-password@database:5432/intervue
      DATABASE_SSL: "false"
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
