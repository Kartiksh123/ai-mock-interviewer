services:
  - type: web
    name: intervue-api
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: intervue-client
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: intervue-database
          property: connectionString
      - key: DATABASE_SSL
        value: "false"

  - type: web
    name: intervue-client
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: intervue-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

databases:
  - name: intervue-database
    plan: free
    databaseName: intervue
    user: intervue
    postgresMajorVersion: "17"
